name: VP Honda Daily Reminders

# ⚠️ ज़रूरी बात — GitHub scheduled workflows को 60 दिन तक repo में कोई activity
#    (commit/push) न होने पर अपने आप DISABLE कर देता है. अगर notifications अचानक
#    बंद हो जाएँ तो सबसे पहले यहाँ देखें:
#      GitHub repo → Actions tab → यह workflow → ऊपर पीला banner "This workflow
#      was disabled because there hasn't been activity..." → "Enable workflow" दबाएँ.
#    यही सबसे आम वजह होती है कि "पहले notification आ रहे थे, अब गायब हैं".

on:
  schedule:
    - cron: '30 3 * * *'      # 9:00 AM IST
    - cron: '30 9 * * *'      # 3:00 PM IST
  workflow_dispatch:           # Actions tab से manual "Run workflow" button

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render + Send Reminder Notifications
        run: |
          URL="https://vp-honda-backend.onrender.com"

          echo "Step 1: Render को जगा रहे हैं (warm-up ping)..."
          curl -s -o /dev/null "$URL/" || true
          echo "Waiting 60 sec for Render to fully wake up..."
          sleep 60

          echo "Step 2: Push health check..."
          curl -s "$URL/api/push/health" || true
          echo ""

          echo "Step 3: Reminder push भेज रहे हैं (3 retries)..."
          for i in 1 2 3; do
            echo "Attempt $i..."
            HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
              -X POST "$URL/api/push/send-reminder-summary" \
              -H "Content-Type: application/json")

            echo "HTTP Status: $HTTP_CODE"
            cat /tmp/response.txt
            echo ""

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Success!"
              exit 0
            fi

            echo "Attempt $i failed (HTTP $HTTP_CODE). Retrying in 30 sec..."
            sleep 30
          done

          echo "❌ All 3 attempts failed"
          exit 1
